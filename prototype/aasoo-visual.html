<!DOCTYPE html>

<title>Aasoo Macrame — visual direction prototype</title>

<body class="bg-[#faf7f2] text-neutral-900">

<div class="fixed top-0 inset-x-0 z-50 bg-amber-300 text-amber-950 text-xs font-semibold py-1 text-center prototype-note">
  PROTOTYPE — throwaway. Flip between A / B / C with the bottom bar or ← → keys.
</div>

<script>

// gradient placeholders stand in for real product/hero images
const IMG = {

  p2: 'linear-gradient(135deg,#d8cbbb,#b8a58a)',
  p3: 'linear-gradient(135deg,#f0e3d0,#d5c3a8)',
  p4: 'linear-gradient(135deg,#e0cfae,#bfae90)',

  p6: 'linear-gradient(135deg,#e9dac6,#c9b399)',

// ---------- shared header (each variant wraps its own layout around this) ----------
function LayoutHeader_vA() {

function LayoutHeader_vC() {

// ---------- VARIANT A: Editorial gallery ----------
function VariantA() {
  return `
  ${LayoutHeader_vA()}
  <!-- full-bleed hero -->
  <section class="relative h-[78vh] overflow-hidden">
    <div class="absolute inset-0" style="background:linear-gradient(160deg,#e9dcc8,#c9b399)"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
    <div class="absolute bottom-0 right-0 left-0 p-10 md:p-16 max-w-3xl">

  <!-- horizontal product strip -->
  <section class="max-w-6xl mx-auto px-6 py-16">
    <div class="flex items-end justify-between mb-8">

      <a class="text-sm text-neutral-500 underline">همه محصولات ←</a>
    </div>
    <div class="flex gap-5 overflow-x-auto pb-2">

  </section>
  <!-- editorial story band -->
  <section class="max-w-6xl mx-auto px-6 py-10 grid md:grid-cols-2 gap-10 items-center">
    <div class="rounded-3xl aspect-[4/3]" style="background:linear-gradient(150deg,#ddcdb6,#bda887)"></div>
    <div>
      <p class="text-amber-700 text-xs mb-3 tracking-widest">درباره آسو</p>

  </section>
  <footer class="max-w-6xl mx-auto px-6 py-12 flex items-center justify-between text-sm text-neutral-500 border-t border-neutral-200 mt-10">
    <span>© آسو مکرومه</span>
    <div class="flex gap-6"><a>اینستاگرام</a><a>تلگرام</a></div>
  </footer>`;
}

// ---------- VARIANT B: Warm craft shop ----------

  return `
  ${LayoutHeader_vB()}
  <!-- compact hero -->
  <section class="max-w-7xl mx-auto px-6 pt-2">
    <div class="rounded-[2rem] overflow-hidden relative">
      <div class="aspect-[21/9] w-full" style="background:linear-gradient(120deg,#efe4d2,#d3bfa1)"></div>
      <div class="absolute inset-0 grid place-items-center text-center">
        <div>
          <p class="text-amber-800 text-sm mb-2">دست‌بافت با عشق</p>
          <h1 class="text-4xl md:text-5xl font-black text-neutral-900">آسو مکرومه</h1>
          <button class="mt-4 bg-amber-700 hover:bg-amber-800 text-white text-sm font-semibold px-6 py-3 rounded-full">مشاهده محصولات</button>
        </div>
      </div>
    </div>
    <!-- category chips -->
    <div class="mt-6 flex flex-wrap gap-3 text-sm">
      <span class="bg-neutral-900 text-white px-4 py-2 rounded-full">همه</span>
      <span class="bg-white border border-neutral-200 px-4 py-2 rounded-full">دیوارکوب</span>
      <span class="bg-white border border-neutral-200 px-4 py-2 rounded-full">آویز گلدان</span>
      <span class="bg-white border border-neutral-200 px-4 py-2 rounded-full">لوازم خانه</span>
      <span class="bg-white border border-neutral-200 px-4 py-2 rounded-full">اکسسوری</span>
    </div>
  </section>
  <!-- warm card grid -->
  <section class="max-w-7xl mx-auto px-6 py-10">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
      ${PRODUCTS.map(p=>`
        <div class="bg-white rounded-2xl overflow-hidden border border-neutral-100 shadow-sm">
          <div class="aspect-square w-full relative" style="background:${IMG[p.img]}">
            <span class="absolute top-3 right-3 bg-white/90 text-[11px] px-2 py-1 rounded-full text-neutral-700">دست‌بافت</span>
          </div>
          <div class="p-4">
            <div class="font-bold">${p.n}</div>
            <div class="text-xs text-neutral-400 mt-1">${p.d}</div>
            <div class="mt-3 flex items-center justify-between">
              <span class="text-amber-700 font-bold">${p.price}</span>

  </section>
  <footer class="mt-8 bg-[#efe7d8] py-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-sm text-neutral-600">
      <span class="font-black text-lg text-neutral-900">آسو مکرومه</span>
      <div class="flex gap-8"><a>اینستاگرام</a><a>تلگرام</a><a>تماس</a></div>
      <span>ارسال با پست ایران</span>

// ---------- VARIANT C: Boutique minimal grid ----------
function VariantC() {
  return `
  ${LayoutHeader_vC()}
  <!-- asymmetric hero -->
  <section class="max-w-6xl mx-auto px-6 pt-8 grid md:grid-cols-12 gap-6 items-stretch">
    <div class="md:col-span-7 rounded-3xl relative overflow-hidden">
      <div class="h-full min-h-[320px]" style="background:linear-gradient(200deg,#dcd2c2,#b3a489)"></div>
      <div class="absolute bottom-6 right-6 left-6 text-white">
        <p class="text-amber-100 text-sm mb-2">نسل نو مکرومه</p>
        <h1 class="text-4xl font-extrabold">سادگی که<br/>می‌گوید من بافتم</h1>
      </div>
    </div>
    <div class="md:col-span-5 rounded-3xl bg-neutral-900 text-white p-10 flex flex-col justify-center">
      <p class="text-amber-300 text-xs mb-4 tracking-widest">SINCE 2026</p>
      <p class="text-2xl font-bold leading-relaxed">سفارشی بساز — اندازه، رنگ و گل به سلیقه‌ی تو.</p>
      <a class="mt-6 text-sm border-b border-amber-300 text-amber-200 self-start pb-1">شروع گفتگو در تلگرام</a>
    </div>
  </section>
  <!-- clean offset product grid -->
  <section class="max-w-6xl mx-auto px-6 py-14">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-x-6 gap-y-12">
      ${PRODUCTS.map((p,i)=>`
        <div class="${i%3===1?'md:mt-10':''}">
          <div class="aspect-[3/4] rounded-2xl bg-neutral-100" style="background:${IMG[p.img]}"></div>
          <div class="mt-3 flex items-baseline justify-between">
            <span class="font-bold">${p.n}</span>
            <span class="text-neutral-400 text-sm">${p.price}</span>
          </div>
          <div class="text-xs text-neutral-400 mt-0.5">${p.d}</div>
        </div>`).join('')}
    </div>
  </section>
  <footer class="border-t border-neutral-200 mt-4">
    <div class="max-w-6xl mx-auto px-6 py-10 flex flex-col md:flex-row items-center justify-between gap-6 text-sm text-neutral-500">
      <span>آسو مکرومه</span>
      <div class="flex gap-8"><a>اینستاگرام</a><a>تلگرام</a></div>
      <div class="flex gap-6"><a>سوالات متداول</a><a>ارسال</a></div>
    </div>
  </footer>`;
}

// ---------- switcher ----------
const VARIANTS = ['A','B','C'];
const NAMES = { A:'Editorial gallery', B:'Warm craft shop', C:'Boutique minimal' };

function currentVariant(){
  const p = new URLSearchParams(location.search).get('variant');
  return VARIANTS.includes(p) ? p : 'A';
}
function render(){
  const v = currentVariant();
  const root = document.getElementById('root');
  root.innerHTML = v==='A'?VariantA(): v==='B'?VariantB(): VariantC();
  history.replaceState(null,'', '?variant='+v);
  document.getElementById('bar-label').textContent = v + ' — ' + NAMES[v];
}
function cycle(dir){
  const v = currentVariant();
  const i = (VARIANTS.indexOf(v)+dir+VARIANTS.length)%VARIANTS.length;
  renderFrom(i);
}
function renderFrom(i){
  history.replaceState(null,'','?variant='+VARIANTS[i]);
  render();
}
document.addEventListener('keydown', e=>{
  const t = e.target;
  const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(typing) return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
// floating bottom bar
document.body.insertAdjacentHTML('beforeend', `
<div id="bar" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;background:#111;color:#fff;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-family:'Vazirmatn',sans-serif;font-size:13px;">
  <button id="bar-prev" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">→</button>
  <span id="bar-label" style="min-width:150px;text-align:center;direction:ltr">A</span>
  <button id="bar-next" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">←</button>
</div>`);
document.getElementById('bar-prev').onclick=()=>cycle(-1);
document.getElementById('bar-next').onclick=()=>cycle(1);
render();
</script>
</body>
</html>
